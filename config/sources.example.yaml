# =============================================================================
# Scrappy -- catalogo de fuentes y parametros de ranking
#
# Copia este fichero a `config/sources.yaml` y ajustalo a tu gusto.
# Todo lo que decide QUE se busca y COMO se puntua vive aqui, no en el codigo.
#
# Referencia: docs/CONFIGURATION.md  y  docs/RANKING.md
# =============================================================================

# -----------------------------------------------------------------------------
# ranking: como se elige "lo mejor".
#
# El problema es que 12.000 upvotes de Reddit no son comparables con 12.000
# likes de TikTok. Por eso el engagement bruto NUNCA se compara entre fuentes:
# primero se convierte al percentil del item dentro de su propio lote.
#
#   score = w_engagement * engagement_norm
#         + w_velocity   * velocity_norm
#         + w_source     * source_weight
#         - penalizaciones
#
# Los tres pesos deberian sumar 1.0 para que el score quede en [0, 1].
# -----------------------------------------------------------------------------
ranking:
  weights:
    engagement: 0.50   # cuanto pesa ser popular dentro de su lote
    velocity: 0.35     # cuanto pesa ser popular RAPIDO (detecta lo que esta explotando)
    source: 0.15       # sesgo manual hacia las fuentes que mas te gustan

  penalties:
    # Se resta del score cuando el item incumple cada condicion.
    too_long: 0.20         # supera max_duration_seconds
    too_short: 0.10        # baja de min_duration_seconds
    no_thumbnail: 0.05     # sin miniatura: mala señal de calidad
    low_comment_ratio: 0.10  # muchos likes y casi ningun comentario (posible bot)

  # Ratio comentarios/engagement por debajo del cual se aplica low_comment_ratio.
  min_comment_ratio: 0.002

  # Score minimo para que un item se llegue a descargar. Sube esto si te
  # llega demasiada morralla; bajalo si el bot publica poco.
  min_score: 0.35


# -----------------------------------------------------------------------------
# sources: un bloque por plataforma.
#
# `weight` es el source_weight de la formula, en [0, 1].
# `budget` es cuantos candidatos pide el adapter en cada ejecucion ANTES de
# filtrar y rankear. Pedir de mas cuesta poco (solo son metadatos) y mejora
# mucho la calidad de la seleccion final.
# -----------------------------------------------------------------------------
sources:

  # ---------------------------------------------------------------------------
  # Reddit -- feeds Atom publicos, sin credenciales.
  #
  # El feed no informa de upvotes, pero viene ordenado por el listado `hot` del
  # subreddit, asi que la posicion es la senal y el scorer la convierte a
  # percentil igual que haria con los upvotes reales.
  #
  # NO HAY OPCION DE ORDEN, y no es un olvido: el feed ignora `sort` y `t`.
  # Comprobado mandandolos -- `sort=top&t=day` y `sort=new` devuelven la misma
  # secuencia exacta de ids. Cualquier clave de orden aqui seria decorativa.
  #
  # Como `hot` incluye posts de varios dias, si aprietas mucho
  # SCRAPPY_MAX_AGE_HOURS descartaras buena parte de lo que trae Reddit.
  #
  # OJO CON EL RATE LIMIT: sin autenticar, Reddit responde 429 con facilidad.
  # Por eso no se consultan todos los subreddits en cada ronda, sino que se
  # rotan: con 9 subreddits y 3 por ronda, se recorre la lista entera cada tres
  # ejecuciones. Poner muchos subreddits es bueno; consultarlos todos de golpe,
  # no.
  # ---------------------------------------------------------------------------
  reddit:
    weight: 0.9
    budget: 60
    subreddits_per_run: 3 # cuantos consultar en cada ronda
    delay_seconds: 12     # espera entre subreddits; bajarlo provoca 429
    subreddits:
      - memes
      - dankmemes
      - PerfectTiming
      - Unexpected
      - nextfuckinglevel
      - AnimalsBeingDerps
      - contagiouslaughter
      - funnyvideos
      - MadeMeSmile

  # ---------------------------------------------------------------------------
  # Lemmy -- la alternativa federada a Reddit. API publica, sin credenciales.
  #
  # Da mas informacion que los feeds de Reddit: votos y comentarios reales, el
  # tipo MIME del medio, y banderas de post fijado y de cuenta bot.
  #
  # `communities` acepta el formato `nombre@instancia`. Si se deja vacia se usa
  # la portada de la instancia, que ya viene agregada y cuesta una sola
  # peticion.
  # ---------------------------------------------------------------------------
  lemmy:
    weight: 0.8
    budget: 50
    instance: https://lemmy.world
    # TopHour | TopSixHour | TopTwelveHour | TopDay | TopWeek | Hot | Active
    sort: TopDay
    delay_seconds: 2
    communities:
      - memes@lemmy.ml
      - lemmyshitpost@lemmy.world
      - funny@sh.itjust.works

  # ---------------------------------------------------------------------------
  # Bluesky -- API abierta, sin credenciales.
  #
  # Es la fuente para pillar lo que empieza a moverse antes de llegar a las
  # redes grandes. `window_hours` es lo que la hace util: sin acotar, la
  # busqueda por `top` devuelve lo mas votado de SIEMPRE (en las pruebas salian
  # posts de 2024 con 58.000 likes), no lo que se esta moviendo ahora.
  #
  # Sin autenticar solo se lee la primera pagina, asi que `budget` por encima
  # de 100 por consulta no aporta nada.
  # ---------------------------------------------------------------------------
  bluesky:
    weight: 0.75
    budget: 60
    window_hours: 24
    delay_seconds: 1
    queries:
      - "meme"
      - "funny video"
      - "shitpost"

  # ---------------------------------------------------------------------------
  # X / Twitter
  #
  # backend `api`   -> requiere tier Basic de pago (~200 USD/mes) para buscar.
  # backend `scrape`-> yt-dlp + cookies, gratis pero contra ToS y fragil.
  # Se elige con SCRAPPY_X_BACKEND en el .env.
  #
  # LOS NUMEROS DE ABAJO SON LA PROTECCION, no una preferencia de gusto. Con el
  # backend `scrape` no hay un limite publicado que respetar: lo que distingue a
  # un lector de un scraper es el ritmo. Un perfil por ronda, cada cuatro horas,
  # se parece a alguien mirando X; cuatro perfiles seguidos, no. Subir
  # `objetivos_por_ronda` o bajar `delay_seconds` es exactamente lo que hace que
  # te marquen la IP y la cuenta.
  #
  # La lista entera se sigue cubriendo: los perfiles se ROTAN entre rondas, asi
  # que con 3 cuentas y 1 por ronda se recorren las tres cada tres rondas.
  # ---------------------------------------------------------------------------
  x:
    weight: 0.7
    budget: 20            # menos candidatos por ronda = menos paginacion
    objetivos_por_ronda: 1 # cuantos perfiles consultar en cada ronda
    delay_seconds: 30     # espera entre perfiles, cuando toca mas de uno
    # Consultas para el backend `api` (sintaxis de X API v2).
    queries:
      - "(funny OR meme) has:videos -is:retweet lang:es min_faves:2000"
      - "(funny OR meme) has:videos -is:retweet lang:en min_faves:5000"
    # Cuentas a vigilar con el backend `scrape` (sin la @).
    #
    # De aqui solo salen tweets CON VIDEO: la pestana de medios trae tambien
    # fotos y se descartan. Una cuenta que solo publique imagenes gasta su
    # ronda y no trae nada, asi que conviene comprobarlas antes de anadirlas.
    # Medido el 22/08/2026: @RealestMemes_ daba 10 videos de 20 medios;
    # @Memes, 0 de 20 (solo fotos).
    accounts:
      - RealestMemes_
      - Memes

    # Salida de emergencia. Los `queryId` de la GraphQL de X se leen solos del
    # bundle JS de su web, que es lo que evita que esto caduque. Si algun dia
    # ese bundle cambia de forma, se fijan aqui a mano y la fuente sigue
    # funcionando sin tocar codigo. Vacios = descubrimiento automatico.
    query_id_user: ""
    query_id_media: ""

  # ---------------------------------------------------------------------------
  # Imgur -- clave gratuita de registro instantaneo. Mucho volumen de memes.
  # La galeria viral se consulta siempre; las etiquetas son opcionales.
  # ---------------------------------------------------------------------------
  imgur:
    weight: 0.7
    budget: 50
    window: day           # day | week | month
    delay_seconds: 1
    tags:
      - memes
      - funny

  # ---------------------------------------------------------------------------
  # Giphy -- clave beta gratuita (100 llamadas/hora, suficiente de sobra).
  #
  # Giphy NO expone likes ni vistas: el ranking usa la posicion en `trending`,
  # que ya es un ranking hecho por ellos. Las tendencias se consultan siempre;
  # las busquedas son opcionales y cada una gasta una llamada.
  # ---------------------------------------------------------------------------
  giphy:
    weight: 0.6
    budget: 40
    rating: pg-13         # g | pg | pg-13 | r
    delay_seconds: 1
    queries:
      - reaction
      - fail

  # ---------------------------------------------------------------------------
  # YouTube Shorts -- requiere ENABLE_TOS_RISKY_SOURCES=true.
  #
  # No pide clave ni cookies, pero descargar de YouTube tambien incumple sus
  # terminos, asi que va detras del mismo flag por coherencia. El riesgo
  # practico es bastante menor que el de TikTok o Instagram: no hay una cuenta
  # tuya que puedan limitar.
  #
  # `queries` usa la busqueda interna de yt-dlp, que no depende de que los
  # parametros de la URL de resultados de YouTube sigan significando lo mismo.
  # ---------------------------------------------------------------------------
  youtube:
    weight: 0.7
    budget: 40
    results_per_query: 20
    max_duration: 180     # YouTube ya admite Shorts de hasta 3 minutos
    min_view_count: 50000
    queries:
      - "shorts memes graciosos"
      - "funny shorts compilation"
    channels: []

  # ---------------------------------------------------------------------------
  # TikTok -- requiere ENABLE_TOS_RISKY_SOURCES=true. Ver docs/LEGAL.md.
  # ---------------------------------------------------------------------------
  tiktok:
    weight: 0.6
    budget: 30
    hashtags:
      - humor
      - memes
      - fyp
    accounts: []
    min_play_count: 100000

  # ---------------------------------------------------------------------------
  # Instagram -- requiere ENABLE_TOS_RISKY_SOURCES=true y cookies de sesion.
  # ---------------------------------------------------------------------------
  instagram:
    weight: 0.6
    budget: 25
    hashtags:
      - memes
      - reels
    accounts: []


# -----------------------------------------------------------------------------
# filters: se aplican ANTES de descargar nada, sobre los metadatos.
# -----------------------------------------------------------------------------
filters:
  # Titulos o descripciones que contengan cualquiera de estas palabras
  # (sin distinguir mayusculas) se descartan. Utiles para temas que no
  # quieres en tu canal.
  blocked_keywords:
    - gore
    - nsfw
    - onlyfans
    - crypto
    - "link in bio"

  # Autores vetados (sin @).
  blocked_authors: []

  # Idiomas permitidos cuando la fuente informa del idioma.
  # Lista vacia = no filtrar por idioma.
  allowed_languages: []


# -----------------------------------------------------------------------------
# delivery: como se presenta el contenido en Telegram.
# -----------------------------------------------------------------------------
delivery:
  # La atribucion (autor + enlace original) es OBLIGATORIA y no se puede
  # desactivar: es lo minimo exigible al republicar trabajo ajeno.
  # Ver docs/LEGAL.md.
  show_score: false        # anade el score al caption, util para calibrar
  show_source_badge: true  # anade un emoji identificando la plataforma
  silent_notifications: false
  # Segundos de espera entre publicaciones consecutivas. Telegram limita a
  # ~20 mensajes/minuto por chat; 4s deja margen de sobra.
  delay_between_posts: 4

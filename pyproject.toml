[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrappy"
version = "0.1.0"
description = "Bot que descubre, rankea y publica los mejores videos cortos y memes en Telegram, sin dejar el contenido en disco."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
keywords = ["telegram", "bot", "memes", "reddit", "curation", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "python-telegram-bot[job-queue,rate-limiter]>=21.6,<22",
    "httpx>=0.27,<0.29",
    "yt-dlp>=2024.8.6",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "aiosqlite>=0.20,<0.22",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<26",
    "Pillow>=10.4,<12",
    "ImageHash>=4.3,<5",
    "APScheduler>=3.10,<4",
    "typer>=0.12,<0.16",
    "rich>=13.7,<15",
    # La TUI va en el nucleo y no en un extra a proposito: se abre con doble
    # clic, y un `ModuleNotFoundError` en ese contexto es una ventana que se
    # cierra sin explicar nada. Textual ya depende de `rich`, que estaba.
    "textual>=8.2,<9",
    # Round-trip de sources.yaml preservando comentarios, que ahi son
    # documentacion real. Ver docs/adr/0010-tui-con-textual.md
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1.1",
    "pytest-cov>=5.0,<7",
    "respx>=0.21,<0.23",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0",
    # Driver headless para probar la TUI sin terminal real.
    "pytest-textual-snapshot>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/Ahiram/Scrappy"
Documentation = "https://github.com/Ahiram/Scrappy/tree/main/docs"
Issues = "https://github.com/Ahiram/Scrappy/issues"
Changelog = "https://github.com/Ahiram/Scrappy/blob/main/CHANGELOG.md"

[project.scripts]
scrappy = "scrappy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrappy"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = [
    "B008",    # llamada a funcion en default: patron habitual de typer
    "RUF001",  # caracteres unicode ambiguos: los docstrings estan en espanol
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
# Los backends `none` y `memory` ignoran argumentos a proposito: su firma debe
# coincidir con la del protocolo aunque no usen todos los parametros.
"src/scrappy/storage/backends.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["scrappy"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
# 3.12 y no 3.11 porque los stubs de numpy (dependencia de ImageHash) usan
# `type` statements que mypy solo sabe leer a partir de 3.12. La compatibilidad
# real con 3.11 la garantiza `target-version = "py311"` de ruff.
python_version = "3.12"
files = ["src/scrappy"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "imagehash.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: pruebas que ejercitan el pipeline completo con dobles de prueba",
]

[tool.coverage.run]
source = ["src/scrappy"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
